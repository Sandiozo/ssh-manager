name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't include passwords, access tokens or private keys.
        Security problems: please report them privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: SSH Manager version
      description: Shown at the bottom of the side bar, e.g. 1.3.13.
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role of the PC(s) involved
      multiple: true
      options:
        - Client
        - Client and server
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `<home>\data\server.log` or `C:\Program Files\SSH Manager\Server\setup.log`
        (see the README's Configuration section). Remove anything private first.
      render: text
