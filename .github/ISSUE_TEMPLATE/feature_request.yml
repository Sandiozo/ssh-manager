name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could SSH Manager help?
      description: What should it do, and where in the app would you expect it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: How do you do this today, if at all?
