# Builds SSHManager-Setup.exe and attaches it to the GitHub release when a version tag (v1.2.3) is
# pushed. The tag must match __version__ in sshmgr/__init__.py.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = ((Get-Content sshmgr/__init__.py -Raw) -replace '(?s).*__version__\s*=\s*"([^"]+)".*', '$1').Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match __version__ $v" }

      - name: Build installer
        run: ./build.ps1 -Python python

      # handy for manual runs; not needed for releases (and fails when the account's artifact storage is full)
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/v')"
        continue-on-error: true
        with:
          name: SSHManager-Setup
          path: |
            build/SSHManager-Setup.exe
            build/SSHManager-Setup.exe.sha256

      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          $hash = ((Get-Content build/SSHManager-Setup.exe.sha256 -Raw).Trim() -split '\s+')[0]
          ./.github/release-notes.ps1 -Version "${{ github.ref_name }}" -Sha256 $hash | Set-Content build/release-notes.md -Encoding utf8

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SSH Manager ${{ steps.notes.outputs.version }}
          body_path: build/release-notes.md
          files: |
            build/SSHManager-Setup.exe
            build/SSHManager-Setup.exe.sha256
